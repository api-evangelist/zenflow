name: Zenflow
description: >-
  Zenflow is a San Francisco-based medical device company founded in 2014 (Y
  Combinator W15) that develops the Zenflow Spring, a small permanent implant
  delivered in a minimally invasive in-office procedure to relieve urinary
  obstruction caused by benign prostatic hyperplasia (BPH). The company
  positions the Spring as a long-lasting alternative to daily BPH medications
  and to more invasive surgical procedures, avoiding their side effects and
  recovery burden. Zenflow is a medical-device / hardware company and does not
  publish a public API, developer platform, SDKs, MCP server, or webhooks; this
  record is maintained in the API Evangelist network as a company profile.
